name: Run notebooks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install "numpy>=2.0" nbclient nbformat ipykernel
      - name: Execute every notebook
        run: |
          for nb in [0-9]*.ipynb; do
            echo "::group::$nb"
            jupyter execute --output=/tmp/out.ipynb "$nb" || exit 1
            echo "::endgroup::"
          done
      - name: Check the complete notebook is up to date
        run: |
          python tools/build_complete.py
          git diff --exit-code "Complete Tutorial.ipynb"
